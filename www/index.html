<style>
:root{--bg:#faf6fa;--card:#fff;--tx:#2b2230;--mut:#7b6f82;--ac:#a0509e;--acs:#f1dff0;--ok:#2f9e6e;--oks:#d9f2e6;--wa:#d9822b;--was:#fbe9d3;--bd:#e8dde9;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1b161e;--card:#261f2a;--tx:#f1eaf3;--mut:#a99bb0;--ac:#d68bd3;--acs:#3b2a3d;--ok:#5cd19b;--oks:#1f3b30;--wa:#f0a45a;--was:#43301d;--bd:#3a3040}}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif;padding-bottom:84px}
main{max-width:520px;margin:0 auto;padding:16px}
.hd{display:flex;align-items:center;gap:12px;margin:4px 0 14px}.hd img{width:56px;height:56px;border-radius:50%}h1{font-size:22px;margin:0}h2{font-size:17px;margin:0 0 8px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:14px;margin-bottom:12px}
.alert{border-radius:16px;padding:14px;margin-bottom:12px;font-weight:600}
.alert.ok{background:var(--oks);color:var(--ok)}.alert.wa{background:var(--was);color:var(--wa)}
.mut{color:var(--mut);font-size:14px}
button,.btn{font:inherit;border:0;border-radius:12px;padding:12px 14px;background:var(--ac);color:var(--onac,#fff);font-weight:600;cursor:pointer;text-decoration:none;display:inline-block;text-align:center}
button.sec,.btn.sec{background:var(--acs);color:var(--ac)}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.row>*{flex:1}
label{display:block;font-size:14px;color:var(--mut);margin:10px 0 4px}
input,select,textarea{width:100%;font:inherit;padding:11px;border-radius:12px;border:1px solid var(--bd);background:var(--bg);color:var(--tx)}
.bar{height:12px;border-radius:8px;background:var(--acs);overflow:hidden;margin:8px 0}.bar>i{display:block;height:100%;background:var(--ac)}
.big{font-size:30px;font-weight:700}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.grid .h{font-size:12px;color:var(--mut)}
.d{position:relative;aspect-ratio:1;border-radius:10px;border:1px solid transparent;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:14px;cursor:pointer;padding:0;color:var(--tx);font-weight:500}
.d.in{border-color:var(--bd)}.d.t{background:var(--oks);color:var(--ok);font-weight:700}.d.today{outline:2px solid var(--ac)}.d.o{border-color:var(--wa);background:var(--was)}.d small{font-size:10px;line-height:1}
.d.x{visibility:hidden}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--bd);display:flex;padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{flex:1;background:none;color:var(--mut);border-radius:0;padding:14px 4px;font-size:13px}nav button.on{color:var(--ac)}
.wl{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--bd)}
.hide{display:none}
.nd{position:absolute;top:4px;right:5px;width:7px;height:7px;border-radius:50%}
.chip{background:var(--bg);color:var(--tx);border:1px solid var(--bd);padding:9px 8px;border-radius:20px;font-weight:500;font-size:14px}.chip.on{background:var(--acs);color:var(--ac);border-color:var(--ac)}
#sh{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;z-index:20}#sh.hide{display:none}
.sheet{background:var(--card);width:100%;max-width:520px;margin:0 auto;border-radius:20px 20px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px));max-height:88vh;overflow:auto}
.ringw{position:relative;width:220px;height:220px;margin:4px auto 8px}.ringw svg{position:absolute;inset:0}.ringw img{position:absolute;left:25px;top:25px;width:170px;height:170px;border-radius:50%;object-fit:cover}
@keyframes pop{0%{transform:scale(.92)}50%{transform:scale(1.06)}100%{transform:scale(1)}}.pop{animation:pop .35s}
.toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 16px);transform:translateX(-50%);background:var(--ac);color:var(--onac,#fff);padding:14px 18px;border-radius:16px;font-weight:700;z-index:30;box-shadow:0 6px 20px rgba(0,0,0,.25);animation:fade 3.6s forwards;max-width:90%;text-align:center}
@keyframes fade{0%{opacity:0;transform:translate(-50%,-10px)}10%,85%{opacity:1;transform:translate(-50%,0)}100%{opacity:0}}
.ht{position:fixed;bottom:-30px;font-size:26px;z-index:29;animation:up 3s ease-in forwards;pointer-events:none}@keyframes up{0%{transform:translateY(0);opacity:1}100%{transform:translateY(-105vh);opacity:0}}
.dr span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:14px}
.sw{width:46px;height:46px;border-radius:50%;padding:0;flex:none;border:3px solid transparent}.sw.on{border-color:var(--tx)}
</style>

<script>
var FM={t50:{n:"Comprimidos de 50 mg",mg:50,u:"comprimidos",box:20},t80:{n:"Comprimidos de 80 mg",mg:80,u:"comprimidos",box:20},liq:{n:"Frasco 8,5 ml (17 mg/ml)",mg:17,u:"ml",box:8.5}};
var S={fmt:"t50",doseMg:50,start:"",days:84,received:0,lead:4,margin:3,taken:{},weights:[],notes:{}};
try{var r=localStorage.getItem("pif1");if(r)S=Object.assign(S,JSON.parse(r))}catch(e){}
function save(){try{localStorage.setItem("pif1",JSON.stringify(S))}catch(e){}}
var $=function(i){return document.getElementById(i)};
function iso(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function pd(s){var a=s.split("-");return new Date(+a[0],+a[1]-1,+a[2])}
function add(d,n){var x=new Date(d);x.setDate(x.getDate()+n);return x}
function fmtD(d){return d.toLocaleDateString("pt-PT",{weekday:"short",day:"numeric",month:"short"})}
function subBiz(d,n){var x=new Date(d);while(n>0){x.setDate(x.getDate()-1);var w=x.getDay();if(w!=0&&w!=6)n--}return x}
function fix(n){return (Math.round(n*100)/100).toString().replace(".",",")}
var today=new Date();today.setHours(0,0,0,0);var T=iso(today);
var cm=new Date(today.getFullYear(),today.getMonth(),1);
function F(){return FM[S.fmt]}
function perDay(){return S.doseMg/F().mg}
function takenCount(){return Object.keys(S.taken).length}
function stock(){return Math.max(0,S.received-takenCount()*perDay())}
function calc(){
 var pdy=perDay(),st=stock(),dl=pdy>0?Math.floor(st/pdy+1e-9):0;
 var next=S.taken[T]?add(today,1):today;
 var last=add(next,dl-1);
 var end=S.start?add(pd(S.start),S.days-1):null;
 var left=S.start?Math.max(0,S.days-takenCount()):null;
 var enough=left!==null&&dl>=left;
 var ob=subBiz(add(last,-S.margin),S.lead);
 return {st:st,dl:dl,last:last,end:end,left:left,enough:enough,ob:ob,late:ob<=today}
}
var justMarked=0,cur=null,curK=null;
var GR=[["a","Apetite",[["Comeu bem","😋"],["Comeu pouco","😐"],["Sem apetite","😿"]]],["e","Energia",[["Brincalhona","😸"],["Normal","🙂"],["Cansada","😴"]]],["g","Digestão",[["Normal","👍"],["Diarreia","💧"],["Vómito","🤢"]]]];
var BAD={"Sem apetite":1,"Diarreia":1,"Vómito":1};
var MS={1:"Um quarto do caminho feito! 🐾",2:"Já vais a meio, que valente! 💜",3:"Só faltam 25%, está quase! ✨",4:"Tratamento concluído! Que campeã! 🎉"};
function esc(t){return String(t||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")}
function pre(){return Math.min(4,Math.floor(takenCount()*4/(S.days||84)))}
function checkMile(b){if(!S.start)return;var n=pre();if(n>b&&n>=1)celebrate(n)}
function celebrate(n){var t=document.createElement("div");t.className="toast";t.textContent=MS[n];document.body.appendChild(t);var els=[t],E=["💜","🐾","💗","✨"];
 for(var i=0;i<16;i++){var h=document.createElement("span");h.className="ht";h.textContent=E[i%4];h.style.left=(Math.random()*92)+"%";h.style.animationDelay=(Math.random()*0.8)+"s";document.body.appendChild(h);els.push(h)}
 setTimeout(function(){els.forEach(function(x){x.remove()})},4200)}
function toggleDay(k){var b=pre();if(S.taken[k])delete S.taken[k];else{S.taken[k]=1;justMarked=1;try{navigator.vibrate&&navigator.vibrate(35)}catch(e){}checkMile(b)}save();all()}
function ring(done){var p=Math.min(1,done/(S.days||84)),C=2*Math.PI*88,logo=document.querySelector(".hd img").src;
 return '<div class="ringw"><svg viewBox="0 0 200 200" width="220" height="220"><circle cx="100" cy="100" r="88" fill="none" stroke="var(--acs)" stroke-width="12"/><circle cx="100" cy="100" r="88" fill="none" stroke="var(--ac)" stroke-width="12" stroke-linecap="round" stroke-dasharray="'+C.toFixed(1)+'" stroke-dashoffset="'+(C*(1-p)).toFixed(1)+'" transform="rotate(-90 100 100)" style="transition:stroke-dashoffset .6s"/></svg><img src="'+logo+'" alt=""></div>'}
function renderHoje(){
 var c=calc(),u=F().u,h="";
 if(!S.start||!S.received){h+='<div class="alert wa">Começa pelas Definições: formato, dose, data de início e stock atual.</div>'}
 else if(c.left===0){h+='<div class="alert ok">Tratamento concluído. Parabéns à gatinha! 🐾</div>'}
 else if(c.enough){h+='<div class="alert ok">Stock suficiente até ao fim do tratamento.</div>'}
 else if(c.dl<=0){h+='<div class="alert wa">Sem stock! Encomenda já.</div>'}
 else if(c.late){h+='<div class="alert wa">Está na hora de encomendar! O stock acaba em '+fmtD(c.last)+' (restam '+c.dl+' dias).</div>'}
 else{h+='<div class="alert ok">Encomendar até '+fmtD(c.ob)+'.</div>'}
 var done=takenCount();
 if(S.start){var p=Math.min(100,Math.round(done/S.days*100));
  h+='<div class="card" style="text-align:center">'+ring(done)+'<div class="big">'+done+' de '+S.days+' dias</div><div class="mut">'+p+'%'+(c.end?' · fim previsto '+fmtD(c.end):'')+'</div>'
  +'<div class="row"><button class="sec" id="bu">Marcar tudo até hoje como tomado</button></div></div>'}
 var tk=!!S.taken[T];
 h+='<div class="card"><h2>Dose de hoje</h2><div class="big">'+fix(perDay())+' '+u+'</div><div class="mut">'+S.doseMg+' mg por dia · '+F().n+'</div>'
  +'<div class="row"><button id="bt" class="'+(justMarked&&tk?'pop':'')+'">'+(tk?"✓ Tomada (toca para desfazer)":"Marcar como tomada")+'</button></div>'
  +'<div class="row"><button class="sec" id="bn">Notas de hoje</button></div></div>';
 justMarked=0;
 h+='<div class="card"><h2>Stock</h2><div class="big">'+fix(c.st)+' '+u+'</div><div class="mut">Dá para '+c.dl+' dias · última dose em '+fmtD(c.last)+'</div>'
  +'<label>Recebi uma encomenda (quantidade em '+u+')</label><input id="rq" type="number" inputmode="decimal" placeholder="'+fix(F().box)+'">'
  +'<div class="row"><button class="sec" id="rb">Adicionar ao stock</button></div></div>';
 $("v-hoje").innerHTML=h;
 $("bt").onclick=function(){toggleDay(T)};
 $("bn").onclick=function(){openDay(T)};
 if($("bu"))$("bu").onclick=function(){var b=pre(),s0=pd(S.start);for(var d=s0;d<=today;d=add(d,1))S.taken[iso(d)]=1;checkMile(b);save();all()};
 $("rb").onclick=function(){var q=parseFloat(($("rq").value||"").replace(",","."));if(q>0){S.received+=q;save();all()}};
}
function openDay(k){curK=k;var n=(S.notes&&S.notes[k])||{};cur={a:n.a||"",e:n.e||"",g:n.g||"",t:n.t||""};drawSheet()}
function drawSheet(){var k=curK,tk=!!S.taken[k],sh=$("sh"),h='<div class="sheet"><h2 style="text-transform:capitalize">'+pd(k).toLocaleDateString("pt-PT",{weekday:"long",day:"numeric",month:"long",year:"numeric"})+'</h2>'
 +'<button id="sd1" class="'+(tk?'':'sec')+'" style="width:100%">'+(tk?"✓ Dose tomada (toca para desfazer)":"Marcar dose como tomada")+'</button>';
 GR.forEach(function(g){h+='<label>'+g[1]+'</label><div class="row" style="margin-top:0">';g[2].forEach(function(o){h+='<button class="chip'+(cur[g[0]]==o[0]?' on':'')+'" data-g="'+g[0]+'" data-o="'+o[0]+'">'+o[1]+' '+o[0]+'</button>'});h+='</div>'});
 h+='<label>Nota</label><textarea id="nt" rows="3" placeholder="Ex.: brincou muito, dormiu bastante…">'+esc(cur.t)+'</textarea><div class="row"><button id="sdone">Concluído</button></div></div>';
 sh.innerHTML=h;sh.classList.remove("hide");
 $("sd1").onclick=function(){toggleDay(k);drawSheet()};
 $("nt").oninput=function(){cur.t=this.value};
 document.querySelectorAll(".chip").forEach(function(b){b.onclick=function(){var g=b.dataset.g,o=b.dataset.o;cur[g]=cur[g]==o?"":o;document.querySelectorAll('.chip[data-g="'+g+'"]').forEach(function(x){x.classList.toggle("on",cur[g]==x.dataset.o)})}});
 $("sdone").onclick=closeDay;sh.onclick=function(e){if(e.target===sh)closeDay()}}
function closeDay(){S.notes=S.notes||{};var c=cur,t=(c.t||"").trim();if(c.a||c.e||c.g||t)S.notes[curK]={a:c.a,e:c.e,g:c.g,t:t};else delete S.notes[curK];save();$("sh").classList.add("hide");all()}
function diary(){var ks=Object.keys(S.notes||{}).sort().reverse().slice(0,14);if(!ks.length)return"";var h='<div class="card"><h2>Diário</h2>';
 ks.forEach(function(k){var n=S.notes[k],em="";GR.forEach(function(g){g[2].forEach(function(o){if(n[g[0]]==o[0])em+=o[1]})});h+='<div class="wl dr" data-k="'+k+'" style="cursor:pointer;gap:8px"><span style="flex:none">'+fmtD(pd(k))+'</span><span style="flex:1;text-align:right">'+em+' '+esc(n.t)+'</span></div>'});return h+'</div>'}
function renderCal(){
 var c=calc(),y=cm.getFullYear(),m=cm.getMonth(),first=new Date(y,m,1),off=(first.getDay()+6)%7,n=new Date(y,m+1,0).getDate();
 var h='<div class="card"><div class="row" style="align-items:center;margin:0 0 10px"><button class="sec" id="pm" style="flex:0 0 48px">‹</button><h2 style="flex:3;text-align:center;margin:0;text-transform:capitalize">'+first.toLocaleDateString("pt-PT",{month:"long",year:"numeric"})+'</h2><button class="sec" id="nm" style="flex:0 0 48px">›</button></div><div class="grid">';
 ["S","T","Q","Q","S","S","D"].forEach(function(x){h+='<div class="h">'+x+'</div>'});
 for(var i=0;i<off;i++)h+='<div class="d x"></div>';
 var s=S.start?pd(S.start):null,e=c.end;
 for(var d=1;d<=n;d++){var dt=new Date(y,m,d),k=iso(dt),cl="d";
  if(s&&dt>=s&&dt<=e)cl+=" in";if(S.taken[k])cl+=" t";if(k==T)cl+=" today";
  var isO=S.start&&!c.enough&&iso(c.ob)==k;if(isO)cl+=" o";
  var nn=S.notes&&S.notes[k],bad=nn&&(BAD[nn.a]||BAD[nn.e]||BAD[nn.g]);
  h+='<button class="'+cl+'" data-k="'+k+'">'+d+((S.taken[k]||isO)?'<small>'+(S.taken[k]?'🐾':'')+(isO?'📦':'')+'</small>':'')+(nn?'<i class="nd" style="background:'+(bad?'var(--wa)':'var(--ac)')+'"></i>':'')+'</button>'}
 h+='</div><p class="mut">Toca num dia para ver ou registar a dose e as notas. 🐾 = dose tomada · ponto = tem nota (laranja se algo preocupou) · 📦 = dia limite para encomendar · contorno = duração do tratamento.</p></div>'+diary();
 if(S.start&&!c.enough&&c.dl>0){
  var a=iso(c.ob).replace(/-/g,""),b=iso(add(c.ob,1)).replace(/-/g,"");
  var url="https://calendar.google.com/calendar/render?action=TEMPLATE&text="+encodeURIComponent("Encomendar GS-441524 (gatinha)")+"&dates="+a+"/"+b+"&details="+encodeURIComponent("Stock a acabar em "+iso(c.last)+". Entrega: "+S.lead+" dias úteis.");
  h+='<a class="btn" target="_blank" rel="noopener" href="'+url+'">Criar lembrete no Google Calendar ('+fmtD(c.ob)+')</a>'}
 $("v-cal").innerHTML=h;
 $("pm").onclick=function(){cm=new Date(y,m-1,1);renderCal()};$("nm").onclick=function(){cm=new Date(y,m+1,1);renderCal()};
 document.querySelectorAll(".d[data-k]").forEach(function(b){b.onclick=function(){openDay(b.dataset.k)}});
 document.querySelectorAll(".dr").forEach(function(b){b.onclick=function(){openDay(b.dataset.k)}});
}
var editD=null;
function renderPeso(){
 var w=S.weights.slice().sort(function(a,b){return a.d<b.d?-1:1}),h='<div class="card"><h2>Registar peso</h2><label>Peso (kg)</label><input id="wk" type="number" inputmode="decimal" step="0.01" placeholder="3,20"><label>Data</label><input id="wd" type="date" value="'+T+'"><div class="row"><button id="wb">Guardar</button></div></div>';
 if(w.length>1){var mn=Math.min.apply(null,w.map(function(x){return x.kg})),mx=Math.max.apply(null,w.map(function(x){return x.kg})),rg=(mx-mn)||1,pts=w.map(function(x,i){return (10+i*(300/(w.length-1)))+","+(10+(1-(x.kg-mn)/rg)*100)}).join(" ");
  h+='<div class="card"><h2>Evolução</h2><svg viewBox="0 0 320 120" style="width:100%"><polyline fill="none" stroke="var(--ac)" stroke-width="3" points="'+pts+'"/></svg><div class="mut">De '+fix(w[0].kg)+' kg para '+fix(w[w.length-1].kg)+' kg</div></div>'}
 if(w.length){h+='<div class="card"><h2>Histórico</h2>';w.slice().reverse().forEach(function(x){h+='<div class="wl" style="align-items:center;gap:8px"><span style="flex:1">'+fmtD(pd(x.d))+' '+x.d.slice(0,4)+'</span><b>'+fix(x.kg)+' kg</b><button class="sec ed" data-d="'+x.d+'" style="flex:none;padding:8px 10px">Editar</button><button class="sec dl" data-d="'+x.d+'" style="flex:none;padding:8px 10px">Apagar</button></div>'});h+='</div>'}
 $("v-peso").innerHTML=h;
 $("wb").onclick=function(){var kg=parseFloat(($("wk").value||"").replace(",",".")),d=$("wd").value;if(kg>0&&d){S.weights=S.weights.filter(function(x){return x.d!=d&&x.d!=editD});S.weights.push({d:d,kg:kg});editD=null;save();all()}};
 document.querySelectorAll("#v-peso .dl").forEach(function(b){b.onclick=function(){if(confirm("Apagar este registo de peso?")){S.weights=S.weights.filter(function(x){return x.d!=b.dataset.d});save();all()}}});
 document.querySelectorAll("#v-peso .ed").forEach(function(b){b.onclick=function(){var x=S.weights.filter(function(y){return y.d==b.dataset.d})[0];if(!x)return;editD=x.d;$("wk").value=x.kg;$("wd").value=x.d;$("wb").textContent="Atualizar registo";window.scrollTo(0,0);$("wk").focus()}});
}
var TH={lilas:["Lilás",["#a0509e","#f1dff0","#faf6fa","#fff"],["#d68bd3","#3b2a3d","#1b161e","#1b1220"]],rosa:["Rosa",["#d6477f","#fbdde8","#fef6f9","#fff"],["#f08ab0","#43202e","#1f1519","#2a0f1a"]],menta:["Menta",["#2a8f7c","#d9f2ec","#f4fbf9","#fff"],["#5cd1bb","#1f3b35","#121c1a","#0b2a24"]],azul:["Azul",["#3b7ddd","#dce8fb","#f5f8fe","#fff"],["#7fb0f5","#1f2f47","#121821","#0d1c33"]]};
function applyTheme(){var t=TH[S.theme]||TH.lilas,dk=window.matchMedia&&matchMedia("(prefers-color-scheme: dark)").matches,v=dk?t[2]:t[1],r=document.documentElement.style;r.setProperty("--ac",v[0]);r.setProperty("--acs",v[1]);r.setProperty("--bg",v[2]);r.setProperty("--onac",v[3])}
try{matchMedia("(prefers-color-scheme: dark)").addEventListener("change",applyTheme)}catch(e){}
function themeCard(){var h='<div class="card"><h2>Cor da app</h2><div class="row" style="justify-content:space-around">';for(var k in TH){h+='<button class="sw'+((S.theme||"lilas")==k?" on":"")+'" data-t="'+k+'" aria-label="'+TH[k][0]+'" style="background:'+TH[k][1][0]+'"></button>'}return h+'</div></div>'}
function renderDef(){
 var o="";for(var k in FM)o+='<option value="'+k+'"'+(S.fmt==k?" selected":"")+'>'+FM[k].n+'</option>';
 var h=themeCard()+'<div class="card"><h2>Tratamento</h2><label>Nome da gatinha</label><input id="cn" type="text" maxlength="24" value="'+esc(S.cat||"")+'" placeholder="Ex.: Mimi"><label>Formato</label><select id="f">'+o+'</select>'
 +'<label>Dose diária (mg), conforme indicação do veterinário</label><input id="dm" type="number" inputmode="decimal" value="'+S.doseMg+'">'
 +'<div class="mut" id="eq" style="margin-top:6px"></div>'
 +'<label>Data de início</label><input id="sd" type="date" value="'+S.start+'">'
 +'<label>Duração (dias)</label><input id="dd" type="number" inputmode="numeric" value="'+S.days+'">'
 +'<label>Stock que tenho agora ('+F().u+')</label><input id="sk" type="number" inputmode="decimal" value="'+fix(stock()).replace(",",".")+'"></div>'
 +'<div class="card"><h2>Alerta de encomenda</h2><label>Dias úteis de entrega</label><input id="ld" type="number" inputmode="numeric" value="'+S.lead+'"><label>Margem de segurança (dias de stock a sobrar)</label><input id="mg" type="number" inputmode="numeric" value="'+S.margin+'">'
 +'<div class="mut" style="margin-top:6px">O alerta aparece em “Hoje” e no calendário (📦) quando chegar o dia limite.</div></div>'
 +'<div class="card"><h2>Lembrete diário da dose</h2><label>Hora</label><input id="rt" type="time" value="'+(S.remTime||"09:00")+'"><div class="row"><a class="btn sec" id="rl" target="_blank" rel="noopener">Criar alarme diário no Google Calendar</a></div><div class="mut" style="margin-top:6px">Cria um evento diário até ao fim do tratamento. O telemóvel avisa com a notificação do calendário.</div></div>'
 +'<div class="card"><h2>Notificações</h2>'+(NAT?'':'<div class="mut">Só funcionam na app instalada.</div>')+'<label style="display:flex;gap:10px;align-items:center;color:var(--tx)"><input id="nd" type="checkbox" style="width:auto"'+(S.nDose?' checked':'')+'> Avisar todos os dias à hora da dose</label><label style="display:flex;gap:10px;align-items:center;color:var(--tx)"><input id="no" type="checkbox" style="width:auto"'+(S.nOrder?' checked':'')+'> Avisar no dia limite para encomendar (09:00)</label></div>'
 +'<div class="row"><button id="sv">Guardar</button></div>'
 +'<div class="row"><button class="sec" id="rs">Apagar todos os dados</button></div>';
 $("v-def").innerHTML=h;
 document.querySelectorAll(".sw").forEach(function(b){b.onclick=function(){S.theme=b.dataset.t;save();applyTheme();document.querySelectorAll(".sw").forEach(function(x){x.classList.toggle("on",x==b)})}});
 function eq(){var f=FM[$("f").value],d=parseFloat($("dm").value)||0;$("eq").textContent="= "+fix(d/f.mg)+" "+f.u+" por dia"}
 function rem(){var t=$("rt").value||"09:00";S.remTime=t;save();var c=calc(),st=S.start&&pd(S.start)>today?pd(S.start):today,n=Math.max(1,c.left===null?S.days:c.left),hh=t.replace(":","")+"00",e=new Date(2000,0,1,+t.slice(0,2),+t.slice(3,5)+15),eh=String(e.getHours()).padStart(2,"0")+String(e.getMinutes()).padStart(2,"0")+"00",d=iso(st).replace(/-/g,"");
  $("rl").href="https://calendar.google.com/calendar/render?action=TEMPLATE&text="+encodeURIComponent("Dose da gatinha (GS-441524)")+"&dates="+d+"T"+hh+"/"+d+"T"+eh+"&recur="+encodeURIComponent("RRULE:FREQ=DAILY;COUNT="+n)+"&details="+encodeURIComponent("Dar "+fix(perDay())+" "+F().u+".")}
 rem();$("rt").oninput=rem;
 eq();$("f").onchange=function(){S.fmt=$("f").value;S.doseMg=parseFloat($("dm").value)||S.doseMg;renderDef()};$("dm").oninput=eq;
 $("sv").onclick=function(){
  S.fmt=$("f").value;S.doseMg=parseFloat($("dm").value)||S.doseMg;S.start=$("sd").value;S.days=parseInt($("dd").value)||84;
  S.cat=$("cn").value.trim();S.nDose=$("nd").checked;S.nOrder=$("no").checked;S.remTime=$("rt").value||"09:00";
  S.lead=parseInt($("ld").value)||0;S.margin=parseInt($("mg").value)||0;
  var sk=parseFloat(($("sk").value||"0").replace(",","."))||0;S.received=sk+takenCount()*perDay();
  save();all();show("hoje")};
 $("rs").onclick=function(){if(confirm("Apagar tudo?")){try{localStorage.removeItem("pif1")}catch(e){}location.reload()}};
}
var NAT=!!(window.Capacitor&&Capacitor.isNativePlatform&&Capacitor.isNativePlatform());
var schT=0;
function sched(){clearTimeout(schT);schT=setTimeout(doSched,400)}
async function doSched(){
 if(!NAT)return;
 try{var LN=Capacitor.Plugins.LocalNotifications;
  var pend=await LN.getPending();if(pend.notifications.length)await LN.cancel({notifications:pend.notifications.map(function(n){return{id:n.id}})});
  if(!S.nDose&&!S.nOrder)return;
  var pr=await LN.requestPermissions();if(pr.display!=="granted")return;
  var c=calc(),list=[];
  if(S.nDose&&(S.left===null||c.left!==0)){var t=(S.remTime||"09:00").split(":");
   list.push({id:1,title:"Dose da gatinha 🐾",body:"Dar "+fix(perDay())+" "+F().u+" ("+S.doseMg+" mg).",schedule:{on:{hour:+t[0],minute:+t[1]},allowWhileIdle:true}})}
  if(S.nOrder&&S.start&&!c.enough&&c.dl>0){var at=new Date(c.ob.getFullYear(),c.ob.getMonth(),c.ob.getDate(),9,0);
   if(at>new Date())list.push({id:2,title:"Encomendar GS-441524 📦",body:"O stock acaba em "+fmtD(c.last)+". Entrega: "+S.lead+" dias úteis.",schedule:{at:at,allowWhileIdle:true}})}
  if(list.length)await LN.schedule({notifications:list});
 }catch(e){}
}
function setTitle(){var n=S.cat||"A minha gatinha";$("ttl").textContent=n;document.title=n}
$("ttl").onclick=function(){var n=prompt("Nome da gatinha:",S.cat||"");if(n!==null){S.cat=n.trim().slice(0,24);save();setTitle();renderDef()}};
function all(){renderHoje();renderCal();renderPeso();renderDef();setTitle();sched()}
function show(v){["hoje","cal","peso","def"].forEach(function(x){$("v-"+x).classList.toggle("hide",x!=v)});document.querySelectorAll("nav button").forEach(function(b){b.classList.toggle("on",b.dataset.v==v)});window.scrollTo(0,0)}
document.querySelectorAll("nav button").forEach(function(b){b.onclick=function(){show(b.dataset.v)}});
applyTheme();all();if(!S.start)show("def");
</script>
</body>
